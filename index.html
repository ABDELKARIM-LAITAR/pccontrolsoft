<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PcControlSoft - 100% Virus-Free PC & Mac Software Directory</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        darkTile: '#1e293b',
                        lightTile: '#ffffff',
                    },
                    boxShadow: {
                        '3d-light': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(255, 255, 255, 0.8)',
                        '3d-dark': '0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1)',
                        '3d-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
        }

        .software-tile {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(0);
        }
        .software-tile:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .downloading-tile {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
        }
        .dark .downloading-tile {
            background-color: #064e3b !important;
            border-color: #10b981 !important;
        }

        .tooltip-box::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #facc15 transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body class="bg-white text-gray-800 dark:bg-slate-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- HEADER BAR -->
    <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-gray-200 dark:border-slate-800 shadow-sm transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            
            <div class="flex items-center space-x-2 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-200 dark:border-emerald-800/60 text-xs sm:text-sm font-semibold shadow-sm">
                <i class="fa-solid fa-shield-halved text-emerald-600 dark:text-emerald-400 text-base animate-pulse"></i>
                <span class="hidden md:inline">100% Virus-Free & Verified</span>
            </div>

            <div class="text-center flex flex-col items-center">
                <div class="flex items-center space-x-2">
                    <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900 dark:text-white">
                        PcControl<span class="text-emerald-600 dark:text-emerald-400">Soft</span>
                    </h1>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium hidden sm:block">
                    Single Click: Direct Download | Double Click: Open Official Page
                </p>
                <div id="liveClock" class="text-[11px] font-mono text-emerald-600 dark:text-emerald-400 font-semibold mt-0.5">
                    Loading Date...
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="themeToggle" class="p-2.5 rounded-xl bg-gray-100 dark:bg-slate-800 text-amber-600 dark:text-amber-400 hover:bg-gray-200 dark:hover:bg-slate-700 transition shadow-inner" title="Toggle Theme">
                    <i id="themeIcon" class="fa-solid fa-chess-knight text-xl transform hover:rotate-12 transition-transform"></i>
                </button>
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-chess-knight text-2xl"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- OS NAVIGATION BAR -->
    <nav class="bg-gray-100 dark:bg-slate-800/60 border-b border-gray-200 dark:border-slate-700 py-2.5 sticky top-20 z-30 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-center space-x-4 sm:space-x-8 text-sm font-medium">
            <button onclick="scrollToOS('windowsSection')" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-700 transition text-slate-700 dark:text-slate-200">
                <i class="fa-brands fa-windows text-blue-500 text-lg"></i>
                <span>Windows OS</span>
            </button>
            <button onclick="scrollToOS('macSection')" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-700 transition text-slate-700 dark:text-slate-200">
                <i class="fa-brands fa-apple text-slate-800 dark:text-slate-100 text-lg"></i>
                <span>macOS</span>
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-8 py-8 flex-1 w-full">

        <section class="max-w-2xl mx-auto mb-10 text-center">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="text" id="searchInput" placeholder="Search software... (Press Ctrl+K)" 
                    class="w-full pl-12 pr-12 py-3.5 rounded-2xl bg-white dark:bg-slate-800 border-2 border-gray-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-emerald-500 shadow-lg text-sm sm:text-base transition">
                <kbd class="hidden sm:inline-block absolute right-4 top-1/2 -translate-y-1/2 px-2 py-1 text-xs font-semibold text-gray-500 bg-gray-100 border border-gray-300 rounded-md dark:bg-slate-700 dark:text-gray-300">Ctrl K</kbd>
            </div>
            <div id="searchCounter" class="text-xs text-gray-500 dark:text-gray-400 mt-2 h-4"></div>
        </section>

        <!-- WINDOWS SOFTWARE SECTION -->
        <section id="windowsSection" class="mb-14">
            <div class="flex items-center justify-between border-b border-gray-300 dark:border-slate-700 pb-3 mb-6">
                <div class="flex items-center space-x-3">
                    <i class="fa-brands fa-windows text-blue-500 text-2xl sm:text-3xl"></i>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Windows Directory</h2>
                </div>
                <span class="text-xs font-semibold px-2.5 py-1 bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 rounded-full">Windows 10 / 11</span>
            </div>
            <div id="windowsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 sm:gap-4"></div>
        </section>

        <!-- MACOS SOFTWARE SECTION -->
        <section id="macSection" class="mb-14">
            <div class="flex items-center justify-between border
