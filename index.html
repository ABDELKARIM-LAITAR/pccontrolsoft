<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DirectSoft - 100% Virus-Free PC & Mac Software Directory</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardDark: '#1e293b'
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles for Red Blinking Cursor & Python Syntax Highlighting -->
    <style>
        /* Custom Red Square Blinking Cursor (4 times per second = 0.25s) */
        input.custom-search-cursor {
            caret-color: transparent; /* Hide default cursor */
        }
        input.custom-search-cursor:focus {
            outline: none;
        }
        /* Simulated custom blinking square cursor via pseudo-element or focus ring if needed */
        
        /* Smooth transitions */
        .transition-all {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-white dark:bg-darkBg text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Transient Passing Motion Animation (Plane/Tank simulation once on load) -->
    <div id="passing-motion" class="fixed top-10 left-[-100px] z-50 pointer-events-none animate-[slideAcross_3s_linear_1]">
        <svg class="w-12 h-12 text-blue-500 opacity-75" fill="currentColor" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    </div>
    <style>
        @keyframes slideAcross {
            0% { transform: translateX(0) translateY(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(110vw) translateY(-20px); opacity: 0; }
        }
    </style>

    <div class="container mx-auto px-4 py-8">
        
        <!-- Header & Search Section -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <h1 class="text-3xl font-black tracking-wider text-blue-600 dark:text-blue-400">DirectSoft</h1>
            
            <!-- Search Bar with Python-style syntax & Bulk Download Button -->
            <div class="flex items-center gap-3 w-full md:w-auto flex-1 max-w-2xl">
                <div class="relative flex-1">
                    <input type="text" id="searchInput" placeholder="Search 128+ software..." 
                           class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-cardDark text-slate-900 dark:text-white shadow-sm focus:ring-2 focus:ring-blue-500 custom-search-cursor">
                </div>
                <!-- Bulk Download / Install Button (Ninite-style) -->
                <button onclick="triggerBulkDownload()" class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow transition whitespace-nowrap">
                    Bulk Install
                </button>
            </div>
        </div>

        <!-- 4 Category Quick-Navigation Rectangles -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <button class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-cardDark hover:border-blue-500 text-center font-medium transition">Web Design</button>
            <button class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-cardDark hover:border-blue-500 text-center font-medium transition">Hosting</button>
            <button class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-cardDark hover:border-blue-500 text-center font-medium transition">Design Tools</button>
            <button class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-cardDark hover:border-blue-500 text-center font-medium transition">AI Tools</button>
        </div>

        <!-- Catalog Container with Vertical Dividers & 64-App Grid Borders -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Windows Section (64 Apps Grid Border) -->
            <div class="border-2 border-slate-300 dark:border-slate-700 p-6 rounded-2xl bg-white dark:bg-slate-900 shadow-sm">
                <h2 class="text-xl font-bold mb-4 text-blue-600 dark:text-blue-400 border-b pb-2 border-slate-200 dark:border-slate-700">Windows Directory (64 Apps)</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="windowsGrid">
                    <!-- App Card Example -->
                    <div onclick="openAppDetails('VS Code')" class="border border-slate-200 dark:border-slate-700 rounded-xl p-4 bg-slate-50 dark:bg-cardDark hover:shadow-md cursor-pointer transition flex flex-col justify-between h-48">
                        <div class="flex justify-between items-start">
                            <span class="text-amber-500 text-sm font-bold">★★★★★</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-mono">88 MB</span>
                        </div>
                        <div class="flex items-center gap-3 my-2">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Visual_Studio_Code_1.35_icon.svg" alt="VS Code" class="w-12 h-12 object-contain">
                            <div class="text-sm font-semibold truncate">Visual Studio Code</div>
                        </div>
                        <!-- Bottom Download Button Containing App Name -->
                        <button onclick="event.stopPropagation(); downloadApp('Visual Studio Code', 'https://code.visualstudio.com/');" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition text-center truncate px-2">
                            Download Visual Studio Code
                        </button>
                    </div>
                    <!-- Repeat for sorted top-to-bottom popular apps -->
                </div>
            </div>

            <!-- macOS Section (64 Apps Grid Border) -->
            <div class="border-2 border-slate-300 dark:border-slate-700 p-6 rounded-2xl bg-white dark:bg-slate-900 shadow-sm">
                <h2 class="text-xl font-bold mb-4 text-blue-600 dark:text-blue-400 border-b pb-2 border-slate-200 dark:border-slate-700">macOS Directory (64 Apps)</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="macGrid">
                    <!-- App Card Example -->
                    <div onclick="openAppDetails('Xcode')" class="border border-slate-200 dark:border-slate-700 rounded-xl p-4 bg-slate-50 dark:bg-cardDark hover:shadow-md cursor-pointer transition flex flex-col justify-between h-48">
                        <div class="flex justify-between items-start">
                            <span class="text-amber-500 text-sm font-bold">★★★★★</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-mono">12 GB</span>
                        </div>
                        <div class="flex items-center gap-3 my-2">
                            <img src="https://developer.apple.com/assets/elements/icons/xcode/xcode-64.svg" alt="Xcode" class="w-12 h-12 object-contain">
                            <div class="text-sm font-semibold truncate">Xcode</div>
                        </div>
                        <!-- Bottom Download Button Containing App Name -->
                        <button onclick="event.stopPropagation(); downloadApp('Xcode', 'https://developer.apple.com/xcode/');" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition text-center truncate px-2">
                            Download Xcode
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Actions & Voice Feedback -->
    <script>
        // Audio & Speech Synthesis on Direct Download Click
        function playClickSound() {
            // Keep base click sound behavior if audio asset exists
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 400;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function downloadApp(appName, url) {
            playClickSound();
            
            // Text-to-Speech announcing downloaded software name
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Downloading " + appName);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
            
            // Direct download action simulation / trigger
            setTimeout(() => {
                window.open(url, '_blank');
            }, 500);
        }

        function openAppDetails(appName) {
            // Opens side panel / modal for extended info
            alert("Opening detailed overview panel for: " + appName);
        }

        function triggerBulkDownload() {
            alert("Initializing Ninite-style bulk installation package...");
        }
    </script>
</body>
</html>
