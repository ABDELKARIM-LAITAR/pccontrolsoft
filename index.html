                { name: "GPU-Z", icon: "fa-solid fa-display", color: "text-green-500", url: "https://www.techpowerup.com/gpuz/" },
                { name: "Cinebench", icon: "fa-solid fa-chart-simple", color: "text-orange-600", url: "https://www.maxon.net/cinebench" },
                { name: "FurMark", icon: "fa-solid fa-fire", color: "text-red-500", url: "https://geeks3d.com/furmark/" }
            ]
        };

        const macSoftwareData = JSON.parse(JSON.stringify(windowsSoftwareData));

        let currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('liveClock').textContent = now.toLocaleDateString('en-US', options) + ' • Daily Verified';
            document.getElementById('yearSpan').textContent = now.getFullYear();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // المتكلم الآلي والنطق
        function speakAppName(text) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 1.0;
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        }

        let hasSpokenPrompt = false;
        function speakPrompt(text) {
            if (!hasSpokenPrompt) {
                speakAppName(text);
                hasSpokenPrompt = true;
                setTimeout(() => { hasSpokenPrompt = false; }, 4000);
            }
        }

        // بناء الشبكة مع دعم الـ 20 تصنيفاً بالكامل
        function renderOSGrid(data, containerId, osName, categoryFilter = "ALL") {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            CATEGORIES.forEach((catName) => {
                if (categoryFilter !== "ALL" && catName !== categoryFilter) {
                    return;
                }

                const columnDiv = document.createElement('div');
                columnDiv.className = 'flex flex-col space-y-3 category-column';
                columnDiv.dataset.category = catName;

                const colHeader = document.createElement('div');
                colHeader.className = 'bg-white dark:bg-slate-800 p-2.5 rounded-xl border border-gray-200 dark:border-slate-700 text-center shadow-sm';
                colHeader.innerHTML = `<span class="text-[11px] font-extrabold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 block truncate">${catName}</span>`;
                columnDiv.appendChild(colHeader);

                const items = data[catName] || [];
                items.forEach((sw) => {
                    const tile = document.createElement('div');
                    tile.dataset.os = osName;
                    tile.dataset.name = sw.name.toLowerCase();
                    tile.dataset.category = catName;
                    tile.className = 'software-tile relative bg-white dark:bg-slate-800/90 rounded-2xl p-4 border border-gray-200/80 dark:border-slate-700 shadow-3d-light dark:shadow-3d-dark hover:shadow-3d-hover group cursor-pointer flex flex-col items-center justify-center text-center h-36 space-y-3';

                    // عند الضغط بضغطة واحدة: نطق اسم البرنامج بالصوت وفتح صفحته الرسمية مباشرة
                    tile.onclick = (e) => {
                        handleSingleClickOpenPage(sw.name, sw.url, tile);
                    };

                    tile.innerHTML = `
                        <div class="tooltip-box opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-md whitespace-nowrap z-30">
                            Single Click: Open Official Page
                        </div>
                        <div class="w-16 h-16 rounded-2xl bg-gray-50 dark:bg-slate-700 flex items-center justify-center text-3xl ${sw.color} transition-transform group-hover:scale-110 shadow-sm">
                            <i class="${sw.icon}"></i>
                        </div>
                        <h4 class="text-sm font-extrabold text-slate-900 dark:text-white truncate w-full px-1">${sw.name}</h4>
                    `;

                    columnDiv.appendChild(tile);
                });

                container.appendChild(columnDiv);
            });
        }

        // دالة فتح الصفحة الرسمية ونطق الاسم بالصوت عند الضغطة الواحدة
        function handleSingleClickOpenPage(name, url, tile) {
            speakAppName(name);
            tile.classList.add('downloading-tile');
            showToast(`Opening official page for ${name}...`);

            setTimeout(() => {
                window.open(url, '_blank');
                setTimeout(() => {
                    tile.classList.remove('downloading-tile');
                }, 1500);
            }, 300);
        }

        const searchInput = document.getElementById('searchInput');
        const searchCounter = document.getElementById('searchCounter');
        const categorySelect = document.getElementById('categorySelect');

        function filterSoftware() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedCategory = categorySelect.value;

            // إعادة بناء الشبكة عند اختيار التصنيف من القائمة
            renderOSGrid(windowsSoftwareData, 'windowsGrid', 'win', selectedCategory);
            renderOSGrid(macSoftwareData, 'macGrid', 'mac', selectedCategory);

            const tiles = document.querySelectorAll('.software-tile');
            let matchCount = 0;

            tiles.forEach(tile => {
                const matchesName = tile.dataset.name.includes(query);
                if (matchesName) {
                    tile.style.display = 'flex';
                    matchCount++;
                } else {
                    tile.style.display = 'none';
                }
            });

            searchCounter.textContent = (query || selectedCategory !== 'ALL') ? `Found ${matchCount} matching software application(s).` : '';
        }

        searchInput.addEventListener('input', filterSoftware);
        categorySelect.addEventListener('change', (e) => {
            filterSoftware();
            const selectedText = e.target.options[e.target.selectedIndex].text;
            showToast(`Filtered by: ${selectedText}`);
        });

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                showToast("Switched to Light Theme");
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                showToast("Switched to Ultra-Dark Theme");
            }
        });

        function scrollToOS(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        document.getElementById('yearSpan').textContent = new Date().getFullYear();

        window.onload = function() {
            renderOSGrid(windowsSoftwareData, 'windowsGrid', 'win');
            renderOSGrid(macSoftwareData, 'macGrid', 'mac');
        };
    </script>
</body>
</html>
