<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DirectSoft - Fast & Direct Software Directory</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardDark: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-black text-blue-400">DirectSoft</h1>
            <div class="w-full max-w-md">
                <input type="text" placeholder="Search software..." 
                       class="w-full px-4 py-3 rounded-xl border border-slate-700 bg-cardDark text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <!-- Main Directory Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Windows Section -->
            <div class="bg-cardDark p-6 rounded-2xl border border-slate-800">
                <h2 class="text-xl font-bold mb-4 text-blue-400">Windows Directory</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700/50 flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold">VS</div>
                        <div>
                            <div class="font-semibold text-sm">Visual Studio Code</div>
                            <a href="https://code.visualstudio.com/" target="_blank" class="text-xs text-blue-400 hover:underline">Direct Download</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- macOS Section -->
            <div class="bg-cardDark p-6 rounded-2xl border border-slate-800">
                <h2 class="text-xl font-bold mb-4 text-blue-400">macOS Directory</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700/50 flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold">XC</div>
                        <div>
                            <div class="font-semibold text-sm">Xcode</div>
                            <a href="https://developer.apple.com/xcode/" target="_blank" class="text-xs text-blue-400 hover:underline">Direct Download</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
